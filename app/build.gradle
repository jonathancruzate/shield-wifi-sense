plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jonathancruzate.shieldwifisense'
    compileSdk 30

    defaultConfig {
        applicationId "com.jonathancruzate.shieldwifisense"
        minSdk 26
        targetSdk 30
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
